# === Globals ===
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

set -g history-limit 10000

# === vim ===
# eliminate <Esc> delay
set -s escape-time 0
# enable vim autoread
set -g focus-events on
# correct $TERM for vim
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# copy mode key bindings
set -w -g mode-keys vi
# status line key bindings
set -g status-keys emacs
# enable mouse control (pane focus/resize/scroll pane, select/copy text)
# osc52 clipboard
#set -g set-clipboard external

set -g mouse on
set -g set-titles on
# start with 1 to match keyboard order
#set -g base-index 1
#setw -g pane-base-index 1
#set -g renumber-windows on

# do not rename windows automatically
setw -g automatic-rename on # tmux driven
set -g allow-rename off # application driven

# === Styles ===
# transparent status bar
set -g status-style 'bg=default fg=#689d6a'
#set -g status-style 'bg=#32302f fg=#ebdbb2'

# status-right-length=40 # 1 reserved for path ellipsis, 10 for date, 29 remaining
# without time: 28 for path, 1 space
# with time (%R): 22 for path, 2 spaces, 5 for time
set -g status-right "#{=|-28|…;s|$HOME|~|:pane_current_path} %Y-%m-%d"

# copy mode
set -g mode-style 'bg=#928374' # 'bg=#665c54'
set -g copy-mode-match-style 'bg=#fabd2f,fg=#1d2021'

# command message colors
set -g message-style 'bg=default fg=#ebdbb2'
#set -g message-command-style 'bg=#1d2021 fg=#fe8019 bold'

# pane split border
set -g pane-active-border 'fg=#689d6a'
set -g pane-border-style 'fg=#928374'

# === copy-mode-vi ===
# enter vi-mode with <prefix>[:
# navigation: 0^$ hjkl HMLgG %{} bBeEwW <C-f><C-b> <C-u><C-d>
# search: /? nN fFtT ,;
# marks: M-x(') X(m)
# visual: <Space>(v) V v(<C-v>) o D(Y)
#bind -T copy-mode-vi C-e send -X end-of-line
#bind -T copy-mode-vi C-b send -X back-to-indentation
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi m   send -X set-mark
bind -T copy-mode-vi "'" send -X jump-to-mark
bind -T copy-mode-vi y   send -X copy-pipe
bind -T copy-mode-vi Y   send -X copy-end-of-line
bind -T copy-mode-vi u   send -X halfpage-up
bind -T copy-mode-vi d   send -X halfpage-down

# === prefix + key ===
bind -N "Reload config" R source-file ~/.config/tmux/tmux.conf \; \
  display-message "\~/.config/tmux/tmux.conf reloaded"
bind -N "Choose paste buffer" b choose-buffer -Z
bind -N "Enter copy mode and scroll up" u copy-mode -u
# go to mark
bind -N "Go to marked pane" "'" switch-client -Z -t '{marked}'
bind -N "Move to last pane (preserving zone)" \; last-pane -Z
# rename
bind -N "Rename window"  W command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Rename session" S command-prompt -I "#S" "rename-session -- '%%'"
# kill
bind -N "Kill window"  X   confirm -p "kill-window #W? (y/n)" kill-window
bind -N "Kill session" C-x confirm -p "kill-session #S? (y/n)" kill-session
# panes
bind -N "Split: vertical"   V split-window -h # prefix + ": top/bottom split
bind -N "Split: horizontal" H split-window -v # prefix + %: left/right split
# or use <prefix> Arrow
bind -r -N "Move pane: left"  h select-pane -L
bind -r -N "Move pane: down"  j select-pane -D
bind -r -N "Move pane: up"    k select-pane -U
bind -r -N "Move pane: right" l select-pane -R
# or use <prefix> ALT-Arrow / CTRL-Arrow
bind -r -N "Resize pane: left"  M-h resize-pane -L
bind -r -N "Resize pane: down"  M-j resize-pane -D
bind -r -N "Resize pane: up"    M-k resize-pane -U
bind -r -N "Resize pane: right" M-l resize-pane -R
# move pane into another window
bind -N "Move pane to a window" J choose-tree -Zw "join-pane -t '%%'"
# =============== CUSTOM ===============
# R       Source file
# X       Kill window
# C-x     Kill session
# u       Scroll up
# '       Go to marked pane
# ;       Move to last pane (preserving zone)
# W       Rename window
# S       Rename session
# b       Choose paste buffer
# h       Move pane: left
# j       Move pane: down
# k       Move pane: up
# l       Move pane: right
# V       Split: vertical
# H       Split: horizontal
# =============== DEFAULTS ===============
# C-b     Send the prefix key
# C-o     Rotate through the panes
# C-z     Suspend the current client
# Space   Select next layout
# !       Break pane to a new window
# "       Split window vertically
# #       List all paste buffers
# $       Rename current session
# %       Split window horizontally
# &       Kill current window
# '       Prompt for window index to select
# (       Switch to previous client
# )       Switch to next client
# ,       Rename current window
# -       Delete the most recent paste buffer
# .       Move the current window
# /       Describe key binding
# 0-9     Select window 0-9
# :       Prompt for a command
# ;       Move to the previously active pane
# =       Choose a paste buffer from a list
# ?       List key bindings
# C       Customize options
# D       Choose a client from a list
# E       Spread panes out evenly
# L       Switch to the last client
# M       Clear the marked pane
# [       Enter copy mode
# ]       Paste the most recent paste buffer
# c       Create a new window
# d       Detach the current client
# f       Search for a pane
# i       Display window information
# l       Select the previously current window
# m       Toggle the marked pane
# n       Select the next window
# o       Select the next pane
# p       Select the previous window
# q       Display pane numbers
# r       Redraw the current client
# s       Choose a session from a list
# t       Show a clock
# w       Choose a window from a list
# x       Kill the active pane
# z       Zoom the active pane
# {       Swap the active pane with the pane above
# }       Swap the active pane with the pane below
# ~       Show messages
# DEL     Reset so the visible part of the window follows the cursor
# Pageup  Enter copy mode and scroll up
# <Arrow> Select the pane to the <Arrow> of the active pane
# M-1     Set the even-horizontal layout
# M-2     Set the even-vertical layout
# M-3     Set the main-horizontal layout
# M-4     Set the main-vertical layout
# M-5     Select the tiled layout
# M-n     Select the next window with an alert
# M-o     Rotate through the panes in reverse
# M-p     Select the previous window with an alert
# M-Arrow Resize the pane <Arrow> direction by 5
# C-Arrow Resize the pane <Arrow> direction
# S-Arrow Move the visible part of the window <Arrow> direction
